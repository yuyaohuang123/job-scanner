# Firms to scan.
#
# `enabled: true`  -- endpoint verified against the live API (see tools/).
# `enabled: false` -- a target whose endpoint isn't resolved yet; `note`
#                     says what's known. Run tools/verify_workday.py or
#                     tools/probe_boards.py to resolve, or scanner.discover
#                     with a careers URL.
#
# Workday:  host, tenant, site. Small boards are read in full. Big boards
#           carry `passes`: server-side facet filters (intern-type, and our
#           countries), each run as a query and the results unioned. Facet
#           ids are per-tenant hashes -- stable, but if a firm reshuffles
#           them the pass gets a 400 and is skipped with a warning; re-run
#           tools/verify_workday.py to refresh.
# Greenhouse / Lever: board (the slug in the public board URL). Owner name
#           was checked for every one -- "bcg" on Greenhouse is Bohen
#           Consulting Group, not Boston.

defaults:
  delay: 1.0
  regions: [uk, china, hong-kong, australia]
  categories: [internship, placement]

firms:

  # ================================================================ Bulge Bracket
  - name: Barclays
    tier: Bulge Bracket
    platform: workday
    enabled: true
    host: barclays.wd3.myworkdayjobs.com
    tenant: barclays
    site: External_Career_Site_Barclays
    passes:
      - workerSubType: ["6139d325cdcc1001a72ceb63d5d60001"]   # Intern

  - name: Deutsche Bank
    tier: Bulge Bracket
    platform: workday
    enabled: true
    host: db.wd3.myworkdayjobs.com
    tenant: db
    site: DBWebsite
    passes:
      - workerSubType: ["645e861bc53a01f8c083feaefb3a1c09"]   # "Q (Interns / Practical Work Exp.)"
      - Country: ["29247e57dbaf46fb855b224e03170bc7", "d4afdeb461d446e4babd204bd102dba8", "6cb77610a8a543aea2d6bc10457e35d4", "d903bb3fedad45039383f6de334ad4db"]

  - name: Wells Fargo
    tier: Bulge Bracket
    platform: workday
    enabled: true
    host: wf.wd1.myworkdayjobs.com
    tenant: wf
    site: WellsFargoJobs
    passes:
      - workerSubType: ["2d264dd4beb00100f05a7d60652a0000"]
      - locationCountry: ["6cb77610a8a543aea2d6bc10457e35d4", "d4afdeb461d446e4babd204bd102dba8", "29247e57dbaf46fb855b224e03170bc7"]

  - name: Morgan Stanley
    tier: Bulge Bracket
    platform: workday
    enabled: true
    host: ms.wd5.myworkdayjobs.com
    tenant: ms
    site: External
    # This board holds experienced hires plus a handful of stray US interns.
    # The Summer Analyst programme is recruited through a separate campus
    # portal that isn't on Workday -- see the unresolved list below.
    passes:
      - workerSubType: ["5a72a211d621102a11412ae10c95037b"]
      - Location_Country: ["d4afdeb461d446e4babd204bd102dba8", "29247e57dbaf46fb855b224e03170bc7", "d903bb3fedad45039383f6de334ad4db"]

  - name: J.P. Morgan
    tier: Bulge Bracket
    platform: oracle
    enabled: true
    host: jpmc.fa.oraclecloud.com
    site: CX_1001
    # Location facet ids, one per country. 33 UK internships/placements at
    # setup, including the 12-month Software Engineer Industrial Placement
    # in Glasgow. 7,400 open reqs in total, so the country filter is what
    # makes this scannable.
    locations:
      - "300000000289276"   # United Kingdom
      - "300000000289330"   # Hong Kong
      - "300000000289192"   # China
      - "300000000289090"   # Australia

  - name: Goldman Sachs
