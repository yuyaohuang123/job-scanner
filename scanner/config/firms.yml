# Firms to scan.
#
# `enabled: true` means the endpoint has been verified against the live API.
# `enabled: false` means the firm is a target but its endpoint details are not
# resolved yet -- run `python -m scanner.discover` to fill them in, which is
# far quicker than hunting through careers pages by hand.
#
# Workday fields:  host, tenant, site   (site id is the path segment in the
#                  public careers URL, e.g. .../en-US/External_Career_Site_X)
# Greenhouse/Lever: board               (the slug in the public board URL)

defaults:
  # Polite pause between requests to the same host, in seconds.
  delay: 1.0
  regions: [uk, china]
  categories: [internship, placement]

firms:

  # ---------------------------------------------------------------- verified
  - name: Barclays
    tier: Bulge Bracket
    platform: workday
    enabled: true
    host: barclays.wd3.myworkdayjobs.com
    tenant: barclays
    site: External_Career_Site_Barclays
    # workerSubType facet id meaning "Intern" for this tenant. Verified live:
    # cuts 808 open roles down to the 40 that are actually internships.
    facets:
      workerSubType: ["6139d325cdcc1001a72ceb63d5d60001"]

