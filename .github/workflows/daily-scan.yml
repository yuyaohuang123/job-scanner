name: Daily job scan

on:
  schedule:
    # 06:15 UTC daily. Deliberately not on the hour: scheduled runs on shared
    # infrastructure get queued behind everyone else's :00 cron jobs.
    - cron: "15 6 * * *"
  workflow_dispatch:  # lets you trigger a run by hand from the Actions tab

# Needed so the workflow can commit the refreshed listings back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # Always build from the branch tip, not the commit the run was
          # triggered from. Without this, "Re-run" replays the original
          # commit, regenerates data from a stale base, and its push is
          # rejected because the first attempt already moved main.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python -m scanner.scan

      # Commit BEFORE attempting the email. Ordering matters: the first live
      # run had a bad SMTP secret, the digest step failed, and the commit step
      # after it was skipped -- so a broken email silently discarded a good
      # scan. Persisting first means email trouble can only ever cost you the
      # notification, never the data.
      - name: Commit updated listings
        if: always()
        run: |
          git config user.name  "job-scanner"
          git config user.email "actions@github.com"
          git add data/listings.json site/data.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
            # If main moved while we ran, replay our commit on top of it. On
            # a conflict in the data files, this run's freshly generated
            # version wins ("theirs" is our commit during a rebase).
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Send digest
        # Runs even if the scan partially failed, so you hear about breakage
        # instead of it failing silently every morning.
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python -m scanner.digest
